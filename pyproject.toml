[project]
name = "comfyui-epsnodes"
description = "Practical workflow utilities for ComfyUI — 22 nodes: a file-backed prompt notebook and prompt builder, a folder-scoped LoRA picker, shareable LoRA sets and a LoRA iterator, image/model/CLIP/VAE/checkpoint switchers, resolution presets, an image grid, a video frame saver, a run multiplier for sweep × image × prompt batches, a provenance-baking image saver, an image distributor, an on/off bypass that unplugs its wire, a splat placement node that makes Render Splat match the 3D preview, a number controller, state controllers that save and recall whole workflows, and a node-pack audit, all backed by plain files you own."
version = "1.5.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
# Deliberately empty: the pack is stdlib-only (torch/comfy come from ComfyUI).
dependencies = []

[project.urls]
Repository = "https://github.com/ericpaulsnowden/comfyui-epsnodes"

[tool.comfy]
# PublisherId must match the publisher created at https://registry.comfy.org
# before the first `comfy node publish`.
PublisherId = "REPLACE_ME"
DisplayName = "EPSNodes"
Icon = ""

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["web"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Without confcutdir, pytest's Package collection imports the repo-root
# __init__.py (ComfyUI's entry point, needs folder_paths) and every run dies
# outside ComfyUI. Scoping collection to tests/ keeps `pytest` runnable as-is.
addopts = "--confcutdir=tests"
